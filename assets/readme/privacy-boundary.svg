<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d"><title id="t">Browser-local privacy boundary</title><desc id="d">Customer inputs and calculations remain in the browser; only an explicit share action creates a URL.</desc><rect width="1200" height="360" rx="28" fill="#07131a"/><text x="55" y="62" fill="#f2f8f8" font-family="system-ui,sans-serif" font-size="31" font-weight="750">The customer data boundary is the browser.</text><rect x="55" y="105" width="690" height="190" rx="24" fill="#0b2529" stroke="#3de2c0" stroke-width="2"/><text x="88" y="148" fill="#3de2c0" font-family="ui-monospace,monospace" font-size="17" font-weight="700">STAYS LOCAL</text><g fill="#edf7f5" font-family="system-ui,sans-serif" font-size="22" font-weight="650"><text x="88" y="193">✓ Inputs and calculations</text><text x="88" y="232">✓ Saved browser scenarios</text><text x="88" y="271">✓ Customer-specific assumptions</text></g><rect x="795" y="105" width="350" height="190" rx="24" fill="#152022" stroke="#526866" stroke-width="2"/><text x="826" y="148" fill="#9ab0ad" font-family="ui-monospace,monospace" font-size="17" font-weight="700">ONLY WHEN ASKED</text><text x="826" y="201" fill="#edf7f5" font-family="system-ui,sans-serif" font-size="22" font-weight="650">Explicit share link</text><text x="826" y="238" fill="#9ab0ad" font-family="system-ui,sans-serif" font-size="18">Inputs encoded in URL</text><text x="600" y="333" text-anchor="middle" fill="#809695" font-family="ui-monospace,monospace" font-size="17">no accounts · no server storage · no analytics on entered values</text></svg>
