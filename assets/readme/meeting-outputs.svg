<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="t d"><title id="t">Four outputs from every calculator</title><desc id="d">Each calculator returns an answer, whiteboard card, conversation script, and next action.</desc><rect width="1200" height="350" rx="28" fill="#07131a"/><text x="55" y="62" fill="#f2f8f8" font-family="system-ui,sans-serif" font-size="31" font-weight="750">Built for the conversation after the calculation.</text><g font-family="system-ui,sans-serif"><g fill="#0c2028" stroke="#26d3b1" stroke-width="2"><rect x="55" y="110" width="250" height="170" rx="20"/><rect x="335" y="110" width="250" height="170" rx="20"/><rect x="615" y="110" width="250" height="170" rx="20"/><rect x="895" y="110" width="250" height="170" rx="20"/></g><g fill="#45e5c3" font-family="ui-monospace,monospace" font-size="17" font-weight="700"><text x="82" y="150">01 / ANSWER</text><text x="362" y="150">02 / EXPLAIN</text><text x="642" y="150">03 / SAY</text><text x="922" y="150">04 / DO</text></g><g fill="#eef7f6" font-size="23" font-weight="700"><text x="82" y="197">Customer answer</text><text x="362" y="197">Whiteboard card</text><text x="642" y="197">Talk track</text><text x="922" y="197">Next action</text></g><g fill="#91aaa9" font-size="17"><text x="82" y="232">Plain-language result</text><text x="362" y="232">Visible assumptions</text><text x="642" y="232">Meeting-ready script</text><text x="922" y="232">What to validate next</text></g></g><text x="600" y="322" text-anchor="middle" fill="#809695" font-family="ui-monospace,monospace" font-size="17">not a quote · not a black box · not the end of discovery</text></svg>
