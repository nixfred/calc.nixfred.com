<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="t d"><title id="t">TokenOps decision flow</title><desc id="d">Workload demand becomes token economics, GPU fit, route scoring, and a validation recommendation.</desc><rect width="1200" height="410" rx="28" fill="#07131a"/><text x="55" y="62" fill="#f2f8f8" font-family="system-ui,sans-serif" font-size="31" font-weight="750">From workload shape to a defensible next move.</text><g font-family="system-ui,sans-serif"><g fill="#0d2029" stroke="#2ecfb0" stroke-width="2"><rect x="50" y="115" width="245" height="190" rx="20"/><rect x="335" y="115" width="245" height="190" rx="20"/><rect x="620" y="115" width="245" height="190" rx="20"/><rect x="905" y="115" width="245" height="190" rx="20"/></g><g fill="#3de2c0" font-family="ui-monospace,monospace" font-size="16" font-weight="700"><text x="77" y="152">DEMAND</text><text x="362" y="152">ECONOMICS</text><text x="647" y="152">FIT GATES</text><text x="932" y="152">RECOMMEND</text></g><g fill="#eff8f7" font-size="22" font-weight="700"><text x="77" y="196">Users × behavior</text><text x="362" y="196">Provider cost</text><text x="647" y="196">Memory + throughput</text><text x="932" y="196">Ranked routes</text></g><g fill="#91aaa9" font-size="17"><text x="77" y="230">calls × role mix</text><text x="362" y="230">ownership ceiling</text><text x="647" y="230">larger gate wins</text><text x="932" y="230">confidence + gaps</text><text x="77" y="257">tokens × adoption</text><text x="362" y="257">editable pricing</text><text x="647" y="257">measured overrides</text><text x="932" y="257">validate next</text></g></g><text x="600" y="360" text-anchor="middle" fill="#91aaa9" font-family="system-ui,sans-serif" font-size="18">When critical discovery is missing, TokenOps recommends not sizing yet.</text></svg>
