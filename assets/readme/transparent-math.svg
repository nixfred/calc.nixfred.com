<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="t d"><title id="t">Transparent calculation stack</title><desc id="d">Every result exposes its meaning, algebra, live substitution, assumptions, and sources.</desc><rect width="1200" height="390" rx="28" fill="#07131a"/><text x="55" y="62" fill="#f2f8f8" font-family="system-ui,sans-serif" font-size="31" font-weight="750">Every number carries its receipts.</text><g font-family="system-ui,sans-serif"><g fill="#0c2028" stroke="#235147" stroke-width="2"><rect x="130" y="105" width="940" height="48" rx="12"/><rect x="160" y="163" width="880" height="48" rx="12"/><rect x="190" y="221" width="820" height="48" rx="12"/><rect x="220" y="279" width="760" height="48" rx="12"/></g><g text-anchor="middle" font-size="19" font-weight="700"><text x="600" y="136" fill="#e9f5f3">WHAT IT MEANS + WHY IT MATTERS</text><text x="600" y="194" fill="#bde5dc">FORMULA + EVERY VARIABLE</text><text x="600" y="252" fill="#78d8c5">LIVE SUBSTITUTION WITH YOUR INPUTS</text><text x="600" y="310" fill="#45e5c3">ASSUMPTIONS · WARNINGS · SOURCES</text></g></g><text x="600" y="360" text-anchor="middle" fill="#809695" font-family="ui-monospace,monospace" font-size="17">If the math cannot be inspected, it does not belong in the meeting.</text></svg>
